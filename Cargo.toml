[package]
name = "derelict-horror"
version = "0.1.0"
edition = "2021"

[dependencies]
bevy = { version = "0.19", features = ["wav"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"

[profile.wasm-release]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = "debuginfo"
